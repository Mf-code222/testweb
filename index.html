<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Weather Dashboard</title> <link rel="stylesheet" href="style.css"> </head> <body> <div class="container"> <header> <h1>Weather Dashboard</h1> <div class="search-container"> <input type="text" id="city-input" placeholder="Enter city name..."> <button id="search-btn">Search</button> </div> </header> <main> <div id="current-weather" class="weather-card"> <h2 id="city-name">New York</h2> <div class="weather-main"> <div class="temperature" id="temperature">22°C</div> <div class="weather-icon"> <img id="weather-icon" src="" alt="Weather icon"> </div> </div> <div class="weather-details"> <p>Feels like: <span id="feels-like">24°C</span></p> <p>Humidity: <span id="humidity">65%</span></p> <p>Wind Speed: <span id="wind-speed">3.2 m/s</span></p> <p>Condition: <span id="weather-condition">Sunny</span></p> </div> </div> <div class="forecast-container"> <h3>5-Day Forecast</h3> <div id="forecast" class="forecast-grid"> <!-- Forecast items will be populated by JavaScript --> </div> </div> </main> <footer> <p>Weather Dashboard © 2024</p> </footer> </div> <script src="script.js"></script> </body> </html>
